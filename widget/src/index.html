<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlobalSync World Clock</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card" id="card" aria-label="World clock">
  <header class="head">
    <img class="mark" src="img/mark.png" alt="" width="34" height="34" draggable="false">
    <div class="title">
      <h1>World Clock</h1>
      <p id="tagline">Great work. <em>No borders.</em></p>
    </div>
    <div class="today"><span id="today-date"></span><span id="today-state" class="state"></span></div>
    <div class="actions">
      <button class="icon-btn" id="btn-add" title="Add a city (Ctrl+N)" aria-label="Add a city">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
      <button class="icon-btn" id="btn-hide" title="Hide (Ctrl+Alt+Shift+W brings it back)" aria-label="Hide widget">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <section class="panel" id="panel-add" hidden>
    <div class="search">
      <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="City, country or code" autocomplete="off" spellcheck="false" aria-label="Search cities">
      <span class="slots" id="slots" title="Clocks in use"></span>
      <button class="link" id="add-close">Done</button>
    </div>
    <div class="results" id="results" role="listbox"></div>
  </section>

  <section class="panel settings" id="panel-settings" hidden></section>

  <div class="list" id="list" role="list"></div>

  <div class="empty" id="empty" hidden>
    <p>No cities yet.</p>
    <button class="primary" id="empty-add">Add your first city</button>
  </div>

  <footer class="foot" id="foot">
    <div class="plan" id="plan" hidden>
      <span class="plan-state" id="plan-state"></span>
      <span class="plan-actions" id="plan-actions">
        <button class="chip-btn" id="btn-copy">Copy times</button>
        <button class="chip-btn gold" id="btn-now">Back to now</button>
      </span>
    </div>
    <div class="scrub" id="scrub" tabindex="0" role="slider" aria-label="Time travel. Drag or use arrow keys." aria-valuemin="-1440" aria-valuemax="1440" aria-valuenow="0">
      <svg class="sun" viewBox="-12 -12 24 24" width="16" height="16"><circle r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M0-8v-2.5M0 8v2.5M-8 0h-2.5M8 0h2.5M5.7-5.7l1.8-1.8M-5.7 5.7l-1.8 1.8M5.7 5.7l1.8 1.8M-5.7-5.7l-1.8-1.8"/></g></svg>
      <div class="track" id="track">
        <div class="band"></div>
        <div class="ticks"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
        <div class="dots" id="dots"></div>
      </div>
      <svg class="moon" viewBox="-12 -12 24 24" width="15" height="15"><path d="M2.6-7A7.4 7.4 0 1 0 7 3.4 6 6 0 1 1 2.6-7z" fill="currentColor"/></svg>
    </div>
    <button class="cta" id="cta" title="Open globalsync-ai.com">
      <span>Free meeting planner</span>
      <b>globalsync-ai.com <svg viewBox="0 0 24 24" width="12" height="12"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></b>
    </button>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script src="cities.js"></script>
<script src="scene.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
