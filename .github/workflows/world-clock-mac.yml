name: world-clock-release
on:
  push:
    branches: [main, codex/pocket-bar]
    paths: ['widget/src/**', 'widget/src-tauri/**', 'widget/package.json', 'widget/package-lock.json', '.github/workflows/world-clock-mac.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-clock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --bundles nsis
            artifact: widget/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: mac
            args: --target universal-apple-darwin --bundles dmg
            artifact: widget/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'widget/src-tauri -> target'
      - run: npm ci
      - name: Check UI syntax
        run: node --check src/pocket.js
      - name: Test stopwatch state transitions
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installer
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: world-clock-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish both installers and verified checksums together
        run: |
          node <<'JS'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const file='frontend/src/data/worldClockRelease.json';
          const rel=JSON.parse(fs.readFileSync(file));
          rel.version=JSON.parse(fs.readFileSync('widget/package.json')).version;
          rel.date=new Date().toISOString().slice(0,10);
          function files(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?files(path.join(dir,e.name)):[path.join(dir,e.name)])}
          for(const platform of ['windows','mac']){
            const ext=platform==='windows'?'.exe':'.dmg';
            const sources=files('release-artifacts/world-clock-'+platform).filter(f=>f.endsWith(ext));
            if(sources.length!==1)throw Error('Expected exactly one '+platform+' installer');
            const name='GlobalSync-World-Clock-'+rel.version+(platform==='windows'?'-Windows-Setup.exe':'-macOS.dmg');
            const dir='frontend/public/downloads/world-clock/'+platform;
            fs.mkdirSync(dir,{recursive:true});
            const bytes=fs.readFileSync(sources[0]);fs.writeFileSync(dir+'/'+name,bytes);
            const sha256=crypto.createHash('sha256').update(bytes).digest('hex');
            fs.writeFileSync(dir+'/SHA256SUMS.txt',sha256+'  '+name+'\n');
            rel[platform]={...rel[platform],href:'/downloads/world-clock/'+platform+'/'+name,size:(bytes.length/1048576).toFixed(1)+' MB',sha256};
          }
          fs.writeFileSync(file,JSON.stringify(rel,null,2)+'\n');
          JS
      - name: Commit release assets to the built branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/downloads/world-clock frontend/src/data/worldClockRelease.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Pocket Bar installers for Windows and macOS'
          git push origin HEAD:"$RELEASE_BRANCH"
